name: CI/CD Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  # 1. Lint, Typecheck & Build Verification (Runs on PRs and Pushes)
  ci:
    name: Lint, Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema & generate client
        run: |
          npx prisma validate
          npx prisma generate

      - name: Run TypeScript check
        run: npx tsc --noEmit

      - name: Run ESLint
        run: npm run lint

      - name: Build Next.js production bundle
        env:
          DATABASE_URL: "postgresql://opentrack:opentrack@localhost:5432/opentrack?schema=public"
          JWT_SECRET: "ci-build-verification-placeholder-secret-32chars"
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

  # 2. Build & Push Docker Image to GitHub Container Registry (ghcr.io)
  docker:
    name: Build & Push Docker Image
    needs: ci
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_lc: ${{ steps.meta.outputs.image_lc }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute lowercase image name
        id: meta
        run: |
          IMAGE_LC=$(echo "${{ env.REGISTRY }}/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "image_lc=${IMAGE_LC}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image_lc }}:latest
            ${{ steps.meta.outputs.image_lc }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 3. Auto-Deploy to Production Server via SSH (Runs when SSH_HOST secret is set)
  deploy:
    name: Deploy to Production Server
    needs: docker
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      HAS_SSH_HOST: ${{ secrets.SSH_HOST != '' }}
    steps:
      - name: Skip notice when SSH secrets are not configured yet
        if: env.HAS_SSH_HOST != 'true'
        run: |
          echo "SSH_HOST secret belum diset di GitHub Settings -> Secrets and variables -> Actions."
          echo "CI dan Docker image (GHCR) sukses dibuat. Tambahkan SSH_HOST, SSH_USER, dan SSH_PRIVATE_KEY untuk mengaktifkan auto-deploy ke VPS."

      - name: Deploy via SSH to VPS / EC2
        if: env.HAS_SSH_HOST == 'true'
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 10m
          script: |
            set -e
            DEPLOY_DIR="${{ secrets.DEPLOY_PATH || '~/opentrack' }}"
            mkdir -p $DEPLOY_DIR
            cd $DEPLOY_DIR

            if [ -d .git ]; then
              echo "[Deploy] Pulling latest repository config..."
              git fetch origin main
              git reset --hard origin/main
            fi

            if [ -n "${{ secrets.GHCR_TOKEN }}" ]; then
              echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            fi

            export OPENTRACK_IMAGE="${{ needs.docker.outputs.image_lc }}:latest"

            # Pastikan Docker network untuk Nginx reverse proxy tersedia
            PROXY_NET=$(grep -E '^PROXY_NETWORK=' .env 2>/dev/null | cut -d '=' -f2- | tr -d '"\r' || true)
            PROXY_NET="${PROXY_NET:-proxy_net}"
            docker network inspect "$PROXY_NET" >/dev/null 2>&1 || docker network create "$PROXY_NET"

            echo "[Deploy] Pulling & restarting container: $OPENTRACK_IMAGE"
            if docker pull "$OPENTRACK_IMAGE"; then
              docker compose -f docker-compose.prod.yml up -d
            else
              echo "[Deploy] Private GHCR image without GHCR_TOKEN - building directly on server..."
              docker compose up -d --build app
            fi

            docker image prune -f

            PORT_CHECK=$(grep -E '^APP_PORT=' .env 2>/dev/null | cut -d '=' -f2- | tr -d '"\r' || true)
            PORT_CHECK="${PORT_CHECK:-3000}"

            echo "[Deploy] Waiting for healthcheck on port ${PORT_CHECK}..."
            for i in $(seq 1 25); do
              if curl -fsS "http://127.0.0.1:${PORT_CHECK}/api/health" | grep -q '"ok"'; then
                echo "[Deploy] Healthcheck OK - deployment successful!"
                exit 0
              fi
              sleep 2
            done

            echo "[Deploy] Healthcheck failed!"
            docker compose logs --tail=50 app
            exit 1
