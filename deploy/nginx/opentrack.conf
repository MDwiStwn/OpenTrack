# Konfigurasi Nginx Reverse Proxy untuk OpenTrack
# Simpan di folder conf.d milik Nginx Anda (misal: ./nginx/conf.d/opentrack.conf)

server {
    listen 80;
    server_name track.domainanda.com;

    # Jika memakai Certbot / HTTPS, aktifkan redirect di bawah ini:
    # return 301 https://$host$request_uri;

    # PENTING: Izinkan upload gambar & video tiket hingga 12 MB (batas aplikasi 10 MB)
    client_max_body_size 12M;

    location / {
        # OPSI A: Jika Nginx berjalan di Docker dan satu network dengan opentrack-app:
        proxy_pass http://opentrack-app:3000;

        # OPSI B: Jika Nginx berjalan di Host OS (atau network_mode: host):
        # proxy_pass http://127.0.0.1:3000;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Mendukung video streaming (HTTP 206 Range) dan upload besar tanpa putus
        proxy_request_buffering off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
